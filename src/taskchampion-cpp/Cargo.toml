[package]
name = "taskchampion-lib"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91.1"   # MSRV

[lib]
crate-type = ["staticlib"]

[dependencies]
taskchampion = { git = "https://github.com/carmiac/taskchampion", rev = "7196569e6ec8f11b2cc29a052ca235609474fe7a", features = [
  "server-git",
  "iterative-tasks",
] }
cxx = "1.0.133"
tokio = { version = "1", features = ["rt"] }

[features]
# use native CA roots, instead of bundled
tls-native-roots = ["taskchampion/tls-native-roots"]

[build-dependencies]
cxx-build = "1.0.133"

[dev-dependencies]
tempfile = "3"
